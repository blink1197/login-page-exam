                <input class="form-control" type="text" id="username">

            <div class="mb-3 position-relative">

                <a class="label-link position-absolute top-0 end-0" id="forgot-password" href="#">Forgot password?</a>
            </div>

            <input type="submit" name="commit" value="Sign in" class="btn btn-primary btn-block">

            <div class="text-white position-relative d-flex align-items-center justify-content-center my-3 divider ">
                <span>or</span>

                <p>New to GitHub? <a class="signup-link">Create an account</a></p>

            <div>

    <footer class="position-absolute bottom-0 w-100 pt-3">
        <ul class="text-center d-flex flex-column flex-md-row align-items-center justify-content-md-evenly mx-auto">
            <li>
                <a href="#" class="footer-link">Terms</a>
            </li>
            <li>
                <a href="#" class="footer-link">Privacy</a>
            </li>
            <li>
                <a href="#" class="footer-link">Docs</a>
            </li>
            <li>
